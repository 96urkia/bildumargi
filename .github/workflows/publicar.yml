# Publicar una versión de Bildumargi.
#
# Se pone en marcha al subir una etiqueta que empiece por «v», por ejemplo:
#   git tag -a v2.1 -m "Bildumargi 2.1"
#   git push origin v2.1
#
# Construye el zip de siempre, un paquete .deb por distribución y el
# instalador de Windows, prueba a instalar cada .deb en un sistema limpio y lo
# adjunta todo a la página de la versión en GitHub, junto con las huellas
# SHA-256.
name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NFPM_VERSION: "2.47.0"

jobs:
  zip:
    name: Zip (Windows y cualquier sistema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir el zip
        run: bash packaging/construir_zip.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: zip
          path: dist/*.zip

  deb:
    name: Paquete .deb (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.imagen }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { imagen: "debian:12",    distro: "deb12" }
          - { imagen: "debian:13",    distro: "deb13" }
          - { imagen: "ubuntu:24.04", distro: "ubuntu24.04" }
    defaults:
      run:
        shell: bash
    steps:
      - name: Herramientas
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv curl ca-certificates adduser util-linux
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          apt-get install -y /tmp/nfpm.deb
      - uses: actions/checkout@v4
      - name: Construir el paquete
        run: bash packaging/construir_deb.sh "${GITHUB_REF_NAME#v}" "${{ matrix.distro }}"
      - name: Probar la instalación en limpio
        run: |
          rm -rf /usr/lib/bildumargi
          apt-get install -y --no-install-recommends ./dist/*.deb
          bildumargi version
          test -f /etc/bildumargi/secretos.env
          test "$(stat -c %a /etc/bildumargi/secretos.env)" = "600"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.distro }}
          path: dist/*.deb

  windows:
    name: Instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Librerías
        run: python -m pip install -r requirements.txt -r packaging/windows/requisitos.txt
      - name: Construir el instalador
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $actual = (Select-String -Path config.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ($v -ne $actual) { throw "La etiqueta ($v) no coincide con VERSION de config.py ($actual)" }
          ./packaging/windows/construir.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/Bildumargi-*-instalador.exe

  publicar:
    name: Publicar en GitHub
    needs: [zip, deb, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Huellas SHA-256
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
