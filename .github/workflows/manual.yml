# Publica el manual en GitHub Pages cada vez que cambia algo en docs/ o en mkdocs.yml
name: Publicar el manual

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "requirements-docs.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs gh-deploy --force --clean
