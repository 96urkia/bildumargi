<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bildumargi</title>
<meta name="description" content="Panel de análisis de la colección de una biblioteca pública a partir de los listados de AbsysNet.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="imagenes/cabecero.png">
<link rel="stylesheet" href="fuentes/fuentes.css?v=1.1">
<link rel="stylesheet" href="css/bildumargi.css?v=1.1">
</head>
<body>

<header class="cabecera">
  <div class="cabecera-interior">
    <div class="marca">
      <img src="imagenes/completo-negativo.svg" alt="Bildumargi" data-logo>
      <span class="red" id="nombre-red"></span>
    </div>
    <div class="derecha">
      <span class="pastilla oculto" id="pastilla-biblioteca">
        <span class="punto"></span><strong id="nombre-biblioteca"></strong>
      </span>
      <span class="pastilla" id="pastilla-base"></span>
    </div>
  </div>
</header>

<main class="principal">
  <div id="avisos-globales"></div>

  <section id="bienvenida">
    <div class="portada">
      <div class="sobretitulo" data-t="sobretitulo"></div>
      <h1 data-t="bienvenida_titulo"></h1>
      <p class="entradilla" data-t="bienvenida_entradilla"></p>
    </div>
    <div class="entrada">
      <div class="asistente" id="pasos"></div>
      <aside class="acceso-clave oculto" id="acceso-clave"></aside>
    </div>
    <div id="avisos-carga"></div>
  </section>

  <section id="analisis" class="oculto">
    <div class="barra-contexto">
      <span class="titulo-biblioteca" id="titulo-biblioteca"></span>
      <span class="meta" id="datos-biblioteca"></span>
      <span class="derecha">
        <button class="boton secundario pequeno" id="btn-informe" data-t="informe"></button>
        <button class="boton secundario pequeno" id="btn-reiniciar" data-t="cambiar_ficheros"></button>
      </span>
    </div>
    <div class="con-lateral">
      <nav class="navegador" id="navegador" aria-label="Bildumargi"></nav>
      <div id="vista"></div>
    </div>
  </section>
</main>

<footer class="pie">
  <div class="pie-interior">
    <span id="autoria">Created by: Asier Urkia. Contact:
      <a href="mailto:bildumargi@gmail.com">bildumargi@gmail.com</a></span>
    <span class="pie-licencia">
      <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener" id="enlace-licencia">AGPLv3</a>
      · <a href="#" target="_blank" rel="noopener" id="enlace-codigo" data-t="codigo_fuente"></a>
    </span>
  </div>
</footer>

<script src="js/i18n.js?v=1.1"></script>
<script src="js/api.js?v=1.1"></script>
<script src="js/componentes.js?v=1.1"></script>
<script src="js/app.js?v=1.1"></script>
</body>
</html>
