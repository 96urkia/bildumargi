# Ejemplo para publicar Bildumargi en la intranet detrás de nginx.
# Copiar a /etc/nginx/sites-available/bildumargi, adaptar el nombre y el
# certificado, y activar con:  sudo ln -s ../sites-available/bildumargi /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name bildumargi.intranet.example;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name bildumargi.intranet.example;
    ssl_certificate     /etc/ssl/bildumargi/bildumargi.crt;
    ssl_certificate_key /etc/ssl/bildumargi/bildumargi.key;

    client_max_body_size 100M;          # listados de AbsysNet y MARC21 grandes
    proxy_read_timeout 600s;            # los análisis pueden tardar

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
